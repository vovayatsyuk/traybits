<!doctype html>
<html lang="en" class="h-full bg-white">
  <head>
    <meta charset="UTF-8" />
    <title>Traybits</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body class="flex flex-col h-full divide-y divide-gray-200" x-data>
    <div class="flex flex-1 min-h-0 divide-x divide-gray-200">
      <aside class="w-48 shrink-0 flex flex-col gap-1 p-2">
        <button @click="$store.app.openSettings()" :class="{ 'bg-gray-100 text-zinc-600': $store.app.settingsOpen }" class="rounded-md px-3 py-2 text-sm text-left flex items-center gap-2 text-zinc-500 hover:bg-gray-100">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          Settings
        </button>
        <div class="border-b border-gray-200 my-0.5 -mx-2"></div>
        <button @click="$store.app.addSnippet()" class="rounded-md px-3 py-2 text-sm text-left flex items-center gap-2 text-zinc-500 hover:bg-gray-100">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New snippet
        </button>
        <nav x-sort.ghost="$store.app.reorderSnippet($item, $position)"
          x-sort:config="{
            forceFallback: true,
            direction: 'vertical',
            fallbackTolerance: 2
          }" class="flex flex-col gap-1 flex-1 min-h-0 overflow-y-auto">
          <template x-for="snippet in $store.app.draft" :key="snippet.id">
            <div x-sort:item="snippet.id" @click="$store.app.selectSnippet(snippet.id)"
                 class="group cursor-default rounded-md px-3 py-2 text-sm flex items-center gap-2"
                 :class="[
                   $store.app.isSnippetActive(snippet.id)
                     ? 'bg-gray-100'
                     : 'hover:bg-gray-50',
                   snippet.enabled || 'opacity-50',
                 ]">
              <span class="truncate flex-1" x-text="snippet.name || 'Snippet'"></span>
              <span x-show="$store.app.runners.get(snippet.id)?.lastError" class="size-1.5 shrink-0 rounded-full bg-red-500"></span>
              <button x-sort:ignore x-hold="$store.app.removeSnippet(snippet.id)" title="Hold to delete" class="invisible w-0 group-hover:w-6 group-hover:visible relative flex size-6 shrink-0 items-center justify-center text-zinc-400 hover:text-red-500 group-[.sortable-ghost]:visible group-[.sortable-ghost]:w-6">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
                <svg class="absolute inset-0 size-full" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                          stroke-dasharray="65.973" stroke-dashoffset="65.973" transform="rotate(-90 12 12)"/>
                </svg>
              </button>
            </div>
          </template>
        </nav>
      </aside>
      <div class="flex-1 min-w-0 flex px-8 py-6 bg-gray-50">
        <section x-show="$store.app.settingsOpen"
          @change="$store.app.saveSettings()"
          class="flex flex-1 flex-col gap-6 max-w-lg mx-auto rounded-lg bg-white p-6 ring ring-gray-200">
          <div class="flex items-center gap-4">
            <span class="cursor-default text-sm text-zinc-700">Start at login</span>
            <div class="group relative ml-auto inline-flex w-11 shrink-0 rounded-full bg-gray-200 p-0.5 inset-ring inset-ring-gray-900/5 outline-offset-2 outline-blue-600 transition-colors duration-200 ease-in-out has-checked:bg-blue-600 has-focus-visible:outline-2">
              <span class="size-5 rounded-full bg-white shadow-xs ring-1 ring-gray-900/5 transition-transform duration-200 ease-in-out group-has-checked:translate-x-5"></span>
              <input type="checkbox" aria-label="Start at login" class="absolute inset-0 size-full appearance-none opacity-0 focus:outline-hidden"
                     :checked="$store.app.autostart"
                     @change="$store.app.setAutostart($event.target.checked)">
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span class="cursor-default text-sm text-zinc-700">Separator</span>
            <div class="ml-auto flex gap-1 bg-gray-100 p-1 rounded-md">
              <label class="chip"><input type="radio" name="separator" value="&#8192;|&#8192;" class="sr-only" x-model="$store.app.settings.separator" >|</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;•&#8192;" class="sr-only" x-model="$store.app.settings.separator">•</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;·&#8192;" class="sr-only" x-model="$store.app.settings.separator">·</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;—&#8192;" class="sr-only" x-model="$store.app.settings.separator">—</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;/&#8192;" class="sr-only" x-model="$store.app.settings.separator">/</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;" class="sr-only" x-model="$store.app.settings.separator">&#8192;</label>
            </div>
          </div>
        </section>
        <template x-for="snippet in $store.app.draft" :key="snippet.id">
          <section x-show="$store.app.isSnippetActive(snippet.id)" x-id="['title', 'enabled', 'timeout', 'code']" class="flex flex-1 flex-col gap-6 max-w-2xl mx-auto rounded-lg bg-white p-6 ring ring-gray-200">
            <div class="grid grid-cols-2 gap-4">
              <div class="flex items-center gap-4">
                <label :for="$id('title')" class="text-sm text-zinc-700">Title</label>
                <input :id="$id('title')" type="text" placeholder="Snippet name" x-model="snippet.name" class="rounded-md flex-1">
              </div>
              <div class="flex items-center gap-2 justify-end">
                <span class="text-sm text-zinc-700">Enabled</span>
                <div class="group relative inline-flex w-11 shrink-0 rounded-full bg-gray-200 p-0.5 inset-ring inset-ring-gray-900/5 outline-offset-2 outline-blue-600 transition-colors duration-200 ease-in-out has-checked:bg-blue-600 has-focus-visible:outline-2">
                  <span class="size-5 rounded-full bg-white shadow-xs ring-1 ring-gray-900/5 transition-transform duration-200 ease-in-out group-has-checked:translate-x-5"></span>
                  <input type="checkbox" aria-label="Enabled" x-model="snippet.enabled" class="absolute inset-0 size-full appearance-none opacity-0 focus:outline-hidden">
                </div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="flex items-center gap-4">
                <label :for="$id('timeout')" class="text-sm text-zinc-700">Update every</label>
                <input :id="$id('timeout')" type="number" min="1" x-model.number="snippet.timeout" class="ml-auto w-24 rounded-md">
                <label :for="$id('timeout')" class="text-sm text-zinc-700">seconds</label>
              </div>
            </div>
            <div class="flex flex-col flex-1 min-h-0">
              <div class="flex items-center justify-between">
                <label :for="$id('code')" class="text-sm text-zinc-700">Code</label>
                <div class="relative" x-data="{ open: false }" @click.outside="open = false">
                  <button type="button" @click="open = !open" class="rounded-md px-2 py-1 text-sm text-zinc-500 hover:bg-gray-100 flex items-center gap-1">
                    Use template
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                  </button>
                  <div x-show="open" x-cloak class="absolute right-0 z-10 mt-1 w-48 rounded-md bg-white py-1 shadow-lg ring ring-gray-200">
                    <template x-for="tpl in $store.app.templates" :key="tpl.name">
                      <button type="button" @click="snippet.code = tpl.code; snippet.timeout = tpl.timeout; open = false" class="block w-full px-3 py-1.5 text-left text-sm text-zinc-700 hover:bg-gray-100" x-text="tpl.name"></button>
                    </template>
                  </div>
                </div>
              </div>
              <textarea :id="$id('code')" spellcheck="false" x-model="snippet.code" class="mt-1 rounded-md break-all flex-1 font-mono"></textarea>
            </div>
          </section>
        </template>
        <div x-cloak x-show="!$store.app.draft.length && !$store.app.settingsOpen" class="flex flex-1 items-center justify-center text-sm text-zinc-400">
          No snippets — click “+ New snippet”
        </div>
      </div>
    </div>
    <div x-show="!$store.app.settingsOpen" class="mt-auto flex gap-4 items-center justify-end p-8 py-6">
      <div class="text-xs" :class="$store.app.status.error && 'text-red-500'" x-text="$store.app.status.text"></div>
      <button @click="$store.app.saveSnippets()" class="rounded-md bg-gray-800 text-white text-sm px-5 py-2.5">Save &amp; Run</button>
    </div>
  </body>
</html>
