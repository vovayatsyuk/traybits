<!doctype html>
<html lang="en" class="h-full bg-gray-100 dark:bg-zinc-900 dark:text-zinc-200">
  <head>
    <meta charset="UTF-8" />
    <title>Traybits</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body class="flex flex-col h-full">
    <div class="m-4 bg-white rounded-lg shadow flex flex-1 min-h-0 divide-x divide-gray-200 dark:bg-zinc-900 dark:divide-zinc-800 dark:border dark:border-zinc-800">
      <aside class="w-48 shrink-0 flex flex-col gap-1 p-2">
        <button id="settings" class="rounded-md px-3 py-2 text-sm text-left flex items-center gap-2 text-zinc-500 hover:bg-gray-100 dark:text-zinc-400 dark:hover:bg-zinc-800">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          Settings
        </button>
        <button id="add" class="rounded-md px-3 py-2 text-sm text-left flex items-center gap-2 text-zinc-500 hover:bg-gray-100 dark:text-zinc-400 dark:hover:bg-zinc-800">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New snippet
        </button>
        <nav id="tabs" class="flex flex-col gap-1 flex-1 min-h-0 overflow-y-auto"></nav>
      </aside>
      <div id="panels" class="flex-1 min-w-0 flex">
        <section id="settings-panel" class="hidden flex-1 flex-col divide-y divide-gray-200 min-w-0 dark:divide-zinc-800">
          <div class="flex items-center px-4 py-4">
            <span class="text-sm text-zinc-700 dark:text-zinc-100">Separator</span>
            <div id="separator" class="ml-auto flex gap-1 bg-gray-100 p-1 rounded-md">
              <label class="chip"><input type="radio" name="separator" value="&#8192;|&#8192;" class="sr-only">|</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;•&#8192;" class="sr-only">•</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;·&#8192;" class="sr-only">·</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;—&#8192;" class="sr-only">—</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;/&#8192;" class="sr-only">/</label>
              <label class="chip"><input type="radio" name="separator" value="&#8192;" class="sr-only">&#8192;</label>
            </div>
          </div>
        </section>
      </div>
      <div id="empty" class="hidden flex-1 items-center justify-center text-sm text-zinc-400">
        No snippets — click “+ New snippet”
      </div>
    </div>
    <template id="panel-template">
      <section class="hidden flex-1 flex-col divide-y divide-gray-200 min-w-0 dark:divide-zinc-800">
        <div class="flex items-center gap-4 px-4 py-4">
          <label for="name" class="text-sm text-zinc-700 dark:text-zinc-100">Title</label>
          <input id="name" type="text" placeholder="Snippet name" class="name rounded-md flex-1 dark:bg-zinc-800 dark:border-zinc-800 dark:text-zinc-200">
          <label class="flex items-center gap-2 text-sm text-zinc-700 dark:text-zinc-100">
            <input type="checkbox" class="enabled rounded dark:bg-zinc-800 dark:border-zinc-700"> Enabled
          </label>
        </div>
        <div class="flex items-center px-4 py-4">
          <label for="timeout" class="text-sm text-zinc-700 dark:text-zinc-100">Seconds to wait between refreshes</label>
          <input id="timeout" type="number" min="1" value="60" class="timeout ml-auto w-24 rounded-md dark:bg-zinc-800 dark:border-zinc-800 dark:text-zinc-200">
        </div>
        <div class="flex flex-col px-4 py-4 flex-1 min-h-0">
          <label for="code" class="text-sm text-zinc-700 dark:text-zinc-100">Code</label>
          <textarea id="code" spellcheck="false" class="code mt-1 rounded-md break-all flex-1 font-mono dark:bg-zinc-800 dark:border-zinc-800 dark:text-zinc-200"></textarea>
        </div>
      </section>
    </template>
    <div class="m-4 mt-auto flex gap-4 items-center justify-end px-4 py-4">
      <div id="status" class="text-xs"></div>
      <button id="save" class="rounded-md bg-gray-800 text-white text-sm px-5 py-2.5 dark:text-black dark:bg-zinc-200">Save &amp; Run</button>
    </div>
  </body>
</html>
